<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="vendor/highlight.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="head">
      <h1>Vortex</h1>
      <select id="kb" hidden></select>
      <button id="newchat" class="ghost" hidden title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <div id="log"></div>

    <div class="composer" id="composer" hidden>
      <div class="box">
        <textarea id="q" rows="1" placeholder="Ask a question about your knowledge base..."></textarea>
        <button id="send" class="primary send" title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" />
          </svg>
        </button>
      </div>
    </div>

    <script src="vendor/marked.js"></script>
    <script src="vendor/highlight.js"></script>
    <script src="md.js"></script>
    <script src="api.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
